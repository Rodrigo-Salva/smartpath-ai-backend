# APLICACION
spring.application.name=smartpath-backend
spring.profiles.active=dev

# DATASOURCE
spring.datasource.url=jdbc:postgresql://localhost:5432/smartpath_dev
spring.datasource.username=postgrest
spring.datasource.password=28demarzo
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# SERVER
server.port=8080

# JWT Configuration

# LOGGING
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# SPRINGDOC / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=org.salva.springcloud.msvc.cursos.smartpathaibackend
springdoc.paths-to-match=/api/**

# GEMINI AI CONFIGURATION
