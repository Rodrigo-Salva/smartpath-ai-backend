# backend/src/main/resources/application.yml
spring:
  application:
    name: smartpath-backend

  profiles:
    active: dev

---
# Profile: dev
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/smartpath_dev
    username: postgrest
    password: 28demarzo
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: tu-super-secreto-jwt-cambiar-en-produccion-debe-ser-muy-largo
  expiration: 86400000  # 24 horas en milisegundos

---
# Profile: staging
spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: jdbc:postgresql://localhost:5432/smartpath_staging
    username: staging_user
    password: staging_pass

server:
  port: 8080

---
# Profile: prod
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

server:
  port: 8080